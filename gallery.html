<!-- 이미지 입력 방식 선택 -->
<div class="mb-3">
  <label class="form-label d-block fw-bold">이미지 첨부 방식</label>
  <div class="form-check form-check-inline">
    <input class="form-check-input" type="radio" name="imageSourceType" id="typeFile" value="file" checked onchange="toggleImageInput()">
    <label class="form-check-label" for="typeFile">내 컴퓨터 파일 업로드</label>
  </div>
  <div class="form-check form-check-inline">
    <input class="form-check-input" type="radio" name="imageSourceType" id="typeUrl" value="url" onchange="toggleImageInput()">
    <label class="form-check-label" for="typeUrl">이미지 URL 주소 입력</label>
  </div>
</div>

<!-- 1) 파일 업로드 입력창 -->
<div class="mb-3" id="fileInputContainer">
  <label for="galleryFileInput" class="form-label">이미지 파일 선택</label>
  <input type="file" class="form-control" id="galleryFileInput" accept="image/*">
</div>

<!-- 2) URL 직접 입력창 (초기에는 숨김) -->
<div class="mb-3" id="urlInputContainer" style="display: none;">
  <label for="galleryUrlInput" class="form-label">이미지 URL 주소</label>
  <input type="url" class="form-control" id="galleryUrlInput" placeholder="https://example.com/image.jpg">
</div><!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>군포시민사회단체협의회 - 활동 갤러리</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f8f9fa;
    }
    .gallery-card-img {
      height: 220px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- 네비게이션 바 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">군포시민사회단체협의회</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">홈</a></li>
          <li class="nav-item"><a class="nav-link" href="notice.html">공지사항</a></li>
          <li class="nav-item"><a class="nav-link" href="statement.html">성명서/성명</a></li>
          <li class="nav-item"><a class="nav-link active" href="gallery.html">활동 갤러리</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 메인 콘텐트 -->
  <div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold">활동 갤러리</h2>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#uploadModal">사진 등록</button>
    </div>

    <!-- 갤러리 카드 목록 영역 -->
    <div class="row row-cols-1 row-cols-md-3 g-4" id="galleryList">
      <!-- Firestore 데이터가 동적으로 로드됩니다 -->
    </div>
  </div>

  <!-- 이미지 등록 모달 (Modal) -->
  <div class="modal fade" id="uploadModal" tabindex="-1" aria-labelledby="uploadModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="uploadModalLabel">갤러리 사진 등록</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="galleryForm">
            <!-- 제목 입력 -->
            <div class="mb-3">
              <label for="galleryTitleInput" class="form-label fw-bold">제목</label>
              <input type="text" class="form-control" id="galleryTitleInput" placeholder="행사 및 활동 제목을 입력하세요" required>
            </div>

            <!-- 내용 입력 -->
            <div class="mb-3">
              <label for="galleryContentInput" class="form-label fw-bold">설명 / 내용</label>
              <textarea class="form-control" id="galleryContentInput" rows="3" placeholder="활동 설명을 간단히 입력하세요"></textarea>
            </div>

            <!-- 이미지 입력 방식 선택 (라디오 버튼) -->
            <div class="mb-3">
              <label class="form-label d-block fw-bold">이미지 첨부 방식</label>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="imageSourceType" id="typeFile" value="file" checked onchange="toggleImageInput()">
                <label class="form-check-label" for="typeFile">내 컴퓨터 파일 업로드</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="imageSourceType" id="typeUrl" value="url" onchange="toggleImageInput()">
                <label class="form-check-label" for="typeUrl">이미지 URL 주소 입력</label>
              </div>
            </div>

            <!-- 1) 파일 업로드 입력창 -->
            <div class="mb-3" id="fileInputContainer">
              <label for="galleryFileInput" class="form-label">이미지 파일 선택 (800KB 이하 권장)</label>
              <input type="file" class="form-control" id="galleryFileInput" accept="image/*">
            </div>

            <!-- 2) URL 직접 입력창 (초기에는 숨김) -->
            <div class="mb-3" id="urlInputContainer" style="display: none;">
              <label for="galleryUrlInput" class="form-label">이미지 URL 주소</label>
              <input type="url" class="form-control" id="galleryUrlInput" placeholder="https://example.com/image.jpg">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
          <button type="button" class="btn btn-primary" onclick="saveGalleryPost()">등록하기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ----------------------------------------------------
    // 1. Firebase 설정 (사용자님의 Firebase 설정을 넣어주세요)
    // ----------------------------------------------------
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase 초기화 (중복 방지)
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // ----------------------------------------------------
    // 2. 입력 방식 선택 토글 함수
    // ----------------------------------------------------
    function toggleImageInput() {
      const selectedType = document.querySelector('input[name="imageSourceType"]:checked').value;
      const fileContainer = document.getElementById('fileInputContainer');
      const urlContainer = document.getElementById('urlInputContainer');

      if (selectedType === 'file') {
        fileContainer.style.display = 'block';
        urlContainer.style.display = 'none';
      } else {
        fileContainer.style.display = 'none';
        urlContainer.style.display = 'block';
      }
    }

    // ----------------------------------------------------
    // 3. 갤러리 데이터 목록 불러오기
    // ----------------------------------------------------
    async function loadGallery() {
      const galleryList = document.getElementById('galleryList');
      galleryList.innerHTML = '';

      try {
        const snapshot = await db.collection('gallery').orderBy('createdAt', 'desc').get();
        if (snapshot.empty) {
          galleryList.innerHTML = '<div class="col-12 text-center text-muted my-5"><p>등록된 게시글이 없습니다.</p></div>';
          return;
        }

        snapshot.forEach(doc => {
          const data = doc.data();
          const cardHtml = `
            <div class="col">
              <div class="card h-100 shadow-sm">
                <img src="${data.imageUrl}" class="card-img-top gallery-card-img" alt="${data.title}" onerror="this.src='https://via.placeholder.com/400x220?text=No+Image';">
                <div class="card-body">
                  <h5 class="card-title fw-bold">${data.title}</h5>
                  <p class="card-text text-secondary">${data.content || ''}</p>
                </div>
              </div>
            </div>
          `;
          galleryList.innerHTML += cardHtml;
        });
      } catch (error) {
        console.error("갤러리 로딩 실패:", error);
        galleryList.innerHTML = '<div class="col-12 text-center text-danger my-5"><p>데이터를 불러오는 중 오류가 발생했습니다.</p></div>';
      }
    }

    // ----------------------------------------------------
    // 4. 갤러리 게시글 저장 (URL / 파일 분기 처리)
    // ----------------------------------------------------
    async function saveGalleryPost() {
      const title = document.getElementById('galleryTitleInput').value.trim();
      const content = document.getElementById('galleryContentInput').value.trim();
      const sourceType = document.querySelector('input[name="imageSourceType"]:checked').value;

      if (!title) {
        alert('제목을 입력해 주세요.');
        return;
      }

      let imageUrl = '';

      if (sourceType === 'file') {
        const fileInput = document.getElementById('galleryFileInput');
        const file = fileInput.files[0];
        if (!file) {
          alert('이미지 파일을 선택해 주세요.');
          return;
        }
        if (file.size > 800 * 1024) {
          alert('파일 크기가 너무 큽니다. 800KB 이하의 이미지를 올리시거나 URL 방식을 사용해 주세요.');
          return;
        }
        imageUrl = await convertFileToBase64(file);
      } else {
        imageUrl = document.getElementById('galleryUrlInput').value.trim();
        if (!imageUrl) {
          alert('이미지 URL 주소를 입력해 주세요.');
          return;
        }
      }

      try {
        await db.collection('gallery').add({
          title: title,
          content: content,
          imageUrl: imageUrl,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert('성공적으로 등록되었습니다!');
        
        // 모달 닫기 및 폼 리셋
        const modalElement = document.getElementById('uploadModal');
        const modal = bootstrap.Modal.getInstance(modalElement);
        modal.hide();
        document.getElementById('galleryForm').reset();
        toggleImageInput();

        // 목록 새로고침
        loadGallery();
      } catch (error) {
        console.error("갤러리 저장 실패:", error);
        alert('저장 중 오류가 발생했습니다.');
      }
    }

    // ----------------------------------------------------
    // 5. 파일 Base64 변환 헬퍼 함수
    // ----------------------------------------------------
    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = (error) => reject(error);
        reader.readAsDataURL(file);
      });
    }

    // 페이지 로드시 갤러리 목록 불러오기
    window.onload = loadGallery;
  </script>
</body>
</html>
