<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="군포시민사회단체협의회 - 정보공개">
  <title>정보공개 | 군포시민사회단체협의회</title>
  <style>
    :root {
      --ink: #172b28;
      --muted: #5e6d68;
      --green: #245c4a;
      --green-dark: #173f34;
      --lime: #d8e8a5;
      --cream: #f7f6ef;
      --paper: #fff;
      --line: #e2e6dc;
      --accent: #e5a64a;
      --danger: #d9534f;
      --max: 1160px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 88px; }
    body { margin: 0; font-family: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); line-height: 1.65; background: var(--paper); }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    .wrap { width: min(var(--max), calc(100% - 44px)); margin-inline: auto; }
    
    .topline { background: var(--green-dark); color: #e9f0e8; font-size: 12px; letter-spacing: .04em; }
    .topline .wrap { display:flex; justify-content:space-between; gap:16px; padding:8px 0; }
    header { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.96); border-bottom: 1px solid rgba(23,63,52,.10); backdrop-filter: blur(12px); }
    .navrow { min-height: 78px; display:flex; align-items:center; justify-content:space-between; gap:28px; }
    .brand { display:flex; align-items:center; gap:12px; min-width: 240px; }
    .brandmark { display:grid; place-items:center; width:42px; height:42px; border-radius:50% 50% 48% 12%; background:var(--green); color:white; font-size:22px; transform:rotate(-5deg); }
    .brandmark span { transform:rotate(5deg); }
    .brand strong { display:block; font-size:17px; letter-spacing:-.04em; line-height:1.3; }
    .brand small { display:block; margin-top:4px; font-size:10px; color:var(--muted); letter-spacing:.11em; }
    
    /* PC 네비게이션 및 드롭다운 */
    nav { display:flex; align-items:center; gap:23px; }
    .nav-group { position: relative; }
    .navitem { position:relative; padding:27px 0; font-size:14px; font-weight:700; white-space:nowrap; display: inline-block; cursor: pointer; }
    .navitem::after { content:""; position:absolute; bottom:18px; left:0; width:0; height:2px; background:var(--green); transition:width .2s; }
    .nav-group:hover .navitem::after, .navitem.active::after { width:100%; }
    
    .dropdown {
      display: none; position: absolute; top: 100%; left: 0; background: #ffffff;
      min-width: 200px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); border: 1px solid var(--line);
      border-radius: 4px; padding: 8px 0; z-index: 100;
    }
    .nav-group:hover .dropdown { display: block; }
    .dropdown a { display: block; padding: 10px 18px; font-size: 13px; font-weight: 600; color: var(--ink); transition: background 0.2s, color 0.2s; }
    .dropdown a:hover, .dropdown a.active { background: var(--cream); color: var(--green); }

    .nav-cta { padding:11px 17px; border-radius:4px; background:var(--green); color:white; font-size:13px; font-weight:700; white-space:nowrap; }
    .menu-toggle { display:none; border:1px solid var(--line); background:white; padding:8px 11px; border-radius:5px; cursor: pointer; }
